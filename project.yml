name: AetherTV
options:
  bundleIdPrefix: com.aethertv
  deploymentTarget:
    tvOS: "18.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

packages:
  AetherEngine:
    url: https://github.com/superuser404notfound/AetherEngine
    from: "7.75.0"
    # 可选组件（Package Traits）默认全部关闭，引擎不会把它们编进包里。需要时在 url 下方追加，例如：
    #   traits:
    #     - TrueHDObjectAudio        # TrueHD Atmos 天空声道
    #     - DTSXObjectAudio          # DTS:X 天空声道
    #     - DolbyVisionFelCurves     # 杜比视界 Profile 7 FEL（曲线折叠，原生路径）
    #     - DolbyVisionStillReshaping # 杜比视界 Profile 5 / 10.0 的预览缩略图与静帧
    #     - DualLayerDolbyVision     # Profile 7 FEL 双层合成（上游不建议对外分发，见其 installation.md）
    # GitHub Actions 的「可选组件」输入会在构建前按同一位置自动写入 traits。
  # AetherEngineSMB 只提供单文件字节读取，没有目录列举 API；目录浏览直接用它底层的 SMBClient。
  # 版本区间与 AetherEngine 的锁定值（0.3.x）一致，所以只会解析出同一份，不会重复链接。
  SMBClient:
    url: https://github.com/kishikawakatsumi/SMBClient
    from: "0.3.1"

targets:
  AetherTV:
    type: application
    platform: tvOS
    deploymentTarget: "18.0"
    # XcodeGen 不会为 application 目标自动生成 scheme，
    # 而工作流里的 `xcodebuild -scheme AetherTV` 需要一个随工程提交的共享 scheme。
    scheme: {}
    sources:
      - path: Sources
        excludes:
          - "**/*.md"
    info:
      path: Sources/App/Info.plist
    settings:
      base:
        PRODUCT_NAME: AetherTV
        PRODUCT_BUNDLE_IDENTIFIER: com.aethertv.player
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        # Swift 6 语言模式下并发检查恒为 error，SWIFT_STRICT_CONCURRENCY 会被整个忽略；
        # 这里用 Swift 5 语言模式 + minimal，让未标注 Sendable 的代码只告警、不阻断构建。
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "3"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: NO
        # 下面两项是 XcodeGen 给 tvOS 应用写死的默认值。图标已放在
        # Sources/App/Assets.xcassets/App Icon & Top Shelf Image.brandassets；
        # tvOS 18 不需要启动图，显式清空，避免 actool 去找不存在的 LaunchImage。
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        ASSETCATALOG_COMPILER_LAUNCHIMAGE_NAME: ""
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    dependencies:
      - package: AetherEngine
        product: AetherEngine
      - package: AetherEngine
        product: AetherEngineSMB
      - package: SMBClient
        product: SMBClient
